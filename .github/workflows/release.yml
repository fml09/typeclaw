name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true

# Fork divergence (ADR 0003 in fml09/typeclaw-operator, owner decision
# 2026-08-26): releases are REGISTRY-ONLY. The upstream publication step is
# removed because the `typeclaw` package is owned by the upstream org and
# OIDC trusted publishing cannot be configured for this fork; the managed
# runtime image embeds its own dependency graph and consumes nothing from
# npm at runtime. Everything else — GHCR-first immutable images, reserved
# bump commit, immutable version tag, GitHub Release — keeps upstream
# semantics.
#
# Serialize every release so two versions cannot race mutable GHCR tags or
# reserve competing package.json bumps on main. `cancel-in-progress: false`:
# a release in flight must NEVER be cancelled mid-publish — the image-first
# ordering and the immutable version tag depend on the job running to
# completion once started. A duplicate dispatch waits instead.
concurrency:
  group: release
  cancel-in-progress: false

# Base image repo, reused across the build/merge jobs. Single source so a
# future repo rename touches one line. Matches GHCR_BASE_IMAGE_REPO in
# src/init/cli-version.ts (the value the per-agent Dockerfile FROMs).
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/typeclaw-base
  RUNTIME_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/typeclaw-runtime

# Job-default permissions are read-only; each job widens only what it needs
# (packages: write for the GHCR push/merge jobs, contents: write for the
# final tag/release job). Keeping the workflow-level grant minimal
# means the checks job — which runs untrusted-ish test code — can't push.
permissions:
  contents: read

jobs:
  # ─────────────────────────── checks ───────────────────────────
  # Runs the full release gate (typecheck/lint/format/test) EXACTLY ONCE,
  # validates the version, bumps package.json, and emits the base Dockerfile
  # as an artifact the build matrix consumes. Splitting this out of the build
  # matrix is what keeps the gate from running per-arch. ci.yml already runs
  # these on every PR; this is the belt-and-suspenders release-time gate.
  checks:
    name: Validate and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      base_exists: ${{ steps.preflight.outputs.base_exists }}
      runtime_exists: ${{ steps.preflight.outputs.runtime_exists }}
      tag_exists: ${{ steps.preflight.outputs.tag_exists }}
      promote_latest: ${{ steps.preflight.outputs.promote_latest }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full first-parent history is needed to recover a partial release
          # after any number of later PRs have merged above its reserved
          # package.json-only version bump.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not `latest`) for two reasons. (1) `bun test --parallel`
          # below requires ≥1.3.13. `latest` happens to satisfy this today,
          # but a future Bun rollback would silently break CI. (2) `latest`
          # makes setup-bun call api.github.com/repos/oven-sh/bun/git/refs/tags
          # to resolve the version, which intermittently 401s under GHA
          # token contention; a pinned version skips that lookup and goes
          # straight to the release download URL.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version
        # Reject anything that isn't a strict x.y.z before mutating npm/git/
        # GHCR. Pre-flight matters because `npm version ${{ inputs.version }}`
        # interpolates the value into a shell command — without this gate, a
        # malformed `inputs.version` only fails at the Docker tag validation
        # step, AFTER the npm package and git tag are already public. The
        # validated value is re-exported as a job output so downstream jobs
        # consume `needs.checks.outputs.version` instead of re-interpolating
        # the raw (unvalidated-at-that-point) input.
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected strict x.y.z)"
            exit 1
          fi
          source_sha="$(bash scripts/resolve-release-source.sh "$VERSION" "$GITHUB_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          # All tests, tarballs, and Dockerfiles below must come from the
          # canonical source, not arbitrary code merged after its reservation.
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for release preflight
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate existing release identity
        id: preflight
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT

          # With npm out of the picture, the mutable-tag guard derives from
          # this repository's own release tags: promoting :latest backward
          # while repairing an older version would strand host installs that
          # pin :latest.
          latest_tag="$(
            git ls-remote --tags origin 'refs/tags/[0-9]*' \
              | sed 's|.*refs/tags/||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1 || true
          )"
          if [ -z "$latest_tag" ]; then
            promote_latest=true
          else
            promote_latest="$(node - "$VERSION" "$latest_tag" <<'NODE'
          const [candidate, current] = process.argv.slice(2).map((version) => version.split('.').map(Number))
          const comparison = candidate[0] - current[0] || candidate[1] - current[1] || candidate[2] - current[2]
          process.stdout.write(comparison >= 0 ? 'true' : 'false')
          NODE
          )"
          fi
          echo "promote_latest=$promote_latest" >> "$GITHUB_OUTPUT"

          inspect_release_image() {
            local ref="$1"
            local output_name="$2"
            local raw="${scratch}/${output_name}.json"
            local err="${scratch}/${output_name}.err"
            if docker buildx imagetools inspect --raw "$ref" >"$raw" 2>"$err"; then
              if ! bash scripts/validate-release-image-index.sh "$raw" "$SOURCE_SHA"; then
                echo "::error::${ref} is not the expected paired multi-arch release index"
                exit 1
              fi
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
              return
            fi
            if grep -Eqi 'manifest unknown|name unknown|not found|404' "$err"; then
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
              return
            fi
            echo "::error::could not determine whether ${ref} exists"
            cat "$err" >&2
            exit 1
          }

          inspect_release_image "${REGISTRY_IMAGE}:${VERSION}" base_exists
          inspect_release_image "${RUNTIME_REGISTRY_IMAGE}:${VERSION}" runtime_exists
          base_exists="$(grep '^base_exists=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          runtime_exists="$(grep '^runtime_exists=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

          tag_exists=false
          if git ls-remote --exit-code --refs origin "refs/tags/${VERSION}" >"${scratch}/tag.out" 2>"${scratch}/tag.err"; then
            tag_exists=true
            git fetch --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
            tag_commit="$(git rev-parse "${VERSION}^{commit}")"
            if [ "$tag_commit" != "$SOURCE_SHA" ] && ! bash scripts/is-release-version-bump.sh "$SOURCE_SHA" "$tag_commit" "$VERSION"; then
              echo "::error::release tag source does not match workflow source: ${tag_commit} is not an exact version-only bump over ${SOURCE_SHA}"
              exit 1
            fi
          elif grep -Eq '(^|[[:space:]])2($|[[:space:]])|not found' "${scratch}/tag.err"; then
            tag_exists=false
          else
            # `git ls-remote --exit-code` uses status 2 with empty stderr when
            # no matching ref exists. Any diagnostic means transport failure.
            if [ -s "${scratch}/tag.err" ]; then
              echo "::error::could not determine whether release tag ${VERSION} exists"
              cat "${scratch}/tag.err" >&2
              exit 1
            fi
            tag_exists=false
          fi
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

          if [ "$runtime_exists" = true ] && [ "$base_exists" != true ]; then
            echo "::error::managed runtime version tag exists without its paired base image"
            exit 1
          fi
          if [ "$tag_exists" = true ] && { [ "$base_exists" != true ] || [ "$runtime_exists" != true ]; }; then
            echo "::error::release tag exists without the complete image release set"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Configure git identity
        # Several tests shell out to `git commit` against tmp repos. GitHub
        # Actions runners have no global user.name/user.email, so the commits
        # would silently fail and leave files staged. ci.yml does the same.
        run: |
          git config --global user.email "ci@typeclaw.dev"
          git config --global user.name "TypeClaw CI"

      - name: Test
        # --parallel distributes test files across CPU workers (added in Bun
        # 1.3.13). Cuts wall time ~3-4x on multi-core runners by lifting the
        # historical "all files in one process" serial bottleneck.
        # --timeout 30000: a handful of runInit tests shell out to a real
        # `bun install` and run 4-5s locally; that crosses the 5s default on
        # the slower GitHub Actions runners.
        run: bun test --parallel --timeout 30000

      - name: Prepare exact managed runtime inputs
        # The TypeClaw release does not exist on npm yet, so the workload image
        # must consume this checkout's publishable tarball. The managed GWS
        # version is an exact source-controlled pin, and package.json/bun.lock
        # freeze the complete TypeClaw production graph across architectures and
        # same-version reruns.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          mkdir -p runtime-input

          typeclaw_tarball="$(npm pack --ignore-scripts --pack-destination runtime-input --json | jq -r '.[0].filename')"
          mv "runtime-input/${typeclaw_tarball}" runtime-input/typeclaw.tgz

          gws_version="$(bun -e "import { GWS_MULTI_ACCOUNT_PLUGIN_EXACT_VERSION } from './src/config'; console.log(GWS_MULTI_ACCOUNT_PLUGIN_EXACT_VERSION)")"
          test -n "$gws_version"
          gws_tarball="$(npm pack --ignore-scripts --pack-destination runtime-input --json "typeclaw-gws-multi-account@${gws_version}" | jq -r '.[0].filename')"
          mv "runtime-input/${gws_tarball}" runtime-input/typeclaw-gws-multi-account.tgz

          test "$(tar -xOf runtime-input/typeclaw.tgz package/package.json | jq -r '.name')" = "typeclaw"
          test "$(tar -xOf runtime-input/typeclaw.tgz package/package.json | jq -r '.version')" = "$VERSION"
          test "$(tar -xOf runtime-input/typeclaw-gws-multi-account.tgz package/package.json | jq -r '.name')" = "typeclaw-gws-multi-account"
          test "$(tar -xOf runtime-input/typeclaw-gws-multi-account.tgz package/package.json | jq -r '.version')" = "$gws_version"

          # Fork divergence: pin FROM to this repository's base image. The
          # builder defaults to the upstream-owned
          # ghcr.io/typeclaw/typeclaw-base, which does not exist here — the
          # first dispatch failed with exactly that. Upstream callers omit
          # the second argument and keep the hardcoded default.
          bun run scripts/emit-managed-runtime-dockerfile.ts "$VERSION" \
            "ghcr.io/${{ github.repository_owner }}/typeclaw-base" \
            > runtime-input/runtime.Dockerfile
          cp package.json bun.lock runtime-input/
          printf '%s\n' "$gws_version" > runtime-input/gws-version.txt
          (cd runtime-input && sha256sum typeclaw.tgz typeclaw-gws-multi-account.tgz package.json bun.lock > SHA256SUMS)

      - name: Generate base Dockerfile
        # Same source as base-image.yml (PR validation) — the published base
        # image is a function of src/init/dockerfile.ts at this commit,
        # tagged with the CLI version. The per-agent Dockerfile written by
        # `typeclaw start` pins this exact tag. Emitted here (once) and
        # handed to both build legs via artifact so the two native runners
        # build from byte-identical Dockerfiles.
        run: bun run scripts/emit-base-dockerfile.ts > base.Dockerfile

      - name: Show generated Dockerfile
        run: cat base.Dockerfile

      - uses: actions/upload-artifact@v4
        with:
          name: base-dockerfile
          path: base.Dockerfile
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: managed-runtime-input
          path: runtime-input/
          if-no-files-found: error

  # Reserve the version on main before any image or npm publication. If main
  # moved since checks started, the push fails before an irreversible artifact
  # exists. A partial run leaves one recognizable package.json-only bump commit
  # that a rerun can reuse even after later PRs merge on top of it.
  reserve-version:
    name: Reserve release version on main
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bump_sha: ${{ steps.reserve.outputs.bump_sha }}

    steps:
      # This fork carries no branch ruleset, so the default GITHUB_TOKEN
      # (contents: write above) may push the bump commit directly to main;
      # upstream needed a bypass-capable deploy key only because of its
      # ruleset. GITHUB_TOKEN pushes also cannot re-trigger workflows,
      # which is exactly what a bookkeeping bump wants.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create or recover the version bump commit
        id: reserve
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin main

          is_release_bump() {
            local commit="$1"
            bash scripts/is-release-version-bump.sh "$SOURCE_SHA" "$commit" "$VERSION"
          }

          bump_sha=''
          remote_main="$(git rev-parse origin/main)"
          if is_release_bump "$remote_main"; then
            bump_sha="$remote_main"
          elif [ "$remote_main" = "$SOURCE_SHA" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
            if git diff --quiet -- package.json; then
              bump_sha="$SOURCE_SHA"
            else
              git config user.name "Typeey"
              git config user.email "typeeybird@gmail.com"
              git add package.json
              git commit -m "$VERSION"
              bump_sha="$(git rev-parse HEAD)"
              git push origin HEAD:main
            fi
          elif git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            while IFS= read -r candidate; do
              if is_release_bump "$candidate"; then
                bump_sha="$candidate"
                break
              fi
            done < <(git rev-list --ancestry-path "${SOURCE_SHA}..origin/main")
          fi

          if [ -z "$bump_sha" ]; then
            echo "::error::main moved before version ${VERSION} was reserved from source ${SOURCE_SHA}"
            exit 1
          fi
          echo "bump_sha=$bump_sha" >> "$GITHUB_OUTPUT"

  # ─────────────────────────── build-base ───────────────────────────
  # One leg per target architecture, each on a NATIVE runner — amd64 on
  # `ubuntu-latest`, arm64 on `ubuntu-24.04-arm` — instead of emulating
  # arm64 under QEMU on a single amd64 runner. The recipe's heavy native
  # installs (@huggingface/transformers + sharp + onnxruntime, Chrome for
  # Testing, curl-impersonate) run ~5x slower under emulation; native runners
  # build both arches in parallel. Mirrors the topology base-image.yml
  # already uses for PR validation.
  #
  # Each leg pushes its single-platform image BY DIGEST (push-by-digest=true),
  # NOT to a tag. The immutable `:X.Y.Z` tag is written exactly once by the
  # merge-base job below, so it never resolves to a single-arch image. Mutable
  # `:latest` promotion is deliberately deferred to the release job, after
  # both indexes have been verified pullable.
  build-base:
    name: Build base image / ${{ matrix.arch }}
    needs: [checks, reserve-version]
    permissions:
      contents: read
      packages: write
    strategy:
      # No fail-fast: a break on one arch still runs the other to completion,
      # so a cross-arch recipe bug (package exists on amd64 but not arm64) is
      # diagnosable from one run. The merge job below refuses to proceed
      # unless BOTH digests are present, so a partial build can't be merged.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: base-dockerfile
          path: .

      - name: Show generated Dockerfile
        run: cat base.Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        # push-by-digest=true uploads the single-platform image as a
        # content-addressed blob+manifest with NO tag. `name` gives the
        # repository the digest lands under; name-canonical=true makes the
        # exported `digest` output a fully-qualified `repo@sha256:...` ref
        # the merge job can pass straight to `imagetools create`.
        #
        # Do NOT add a "skip if exists" guard: partial-failure recovery
        # (digests pushed, a later release stage failed) depends on a re-run re-pushing
        # identical content so the merge+verify steps have something to
        # assemble. Re-pushing the same digest to GHCR is idempotent.
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch registry cache, written mode=max. release is the trusted
          # publishing context, so it keeps the per-arch refs warm for the
          # next release (and for base-image.yml PR validation, which reads
          # the same `:cache-<arch>` refs). Per-arch (not one shared `:cache`)
          # because the two legs run concurrently and would race a single ref.
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:cache-${{ matrix.arch }},mode=max

      - name: Export digest
        # The merge job needs each leg's digest, but matrix legs share one
        # logical job-output namespace (the second leg's output would clobber
        # the first). The canonical workaround: each leg writes an empty file
        # NAMED after its digest into a per-arch artifact; the merge job
        # downloads all of them with merge-multiple and reconstructs the
        # refs. `${digest#sha256:}` strips the algo prefix so the bare hex is
        # a valid filename.
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────── merge-base ───────────────────────────
  # Assembles the two single-arch digests into a multi-arch manifest list at
  # `:X.Y.Z`, then verifies it is anonymously pullable on both platforms. This
  # is the SINGLE WRITER of the version-named tag. It
  # `needs:` the whole build matrix, so it only runs once both arches pushed
  # their digests. The verify step is the publish gate: the release job
  # `needs: merge-base`, so the release job cannot run unless a real multi-arch
  # manifest resolved and pulled cleanly from a logged-out client.
  merge-base:
    name: Merge and verify base image
    needs: [checks, build-base]
    runs-on: ubuntu-latest
    outputs:
      version_digest: ${{ steps.verify.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest lists
        if: needs.checks.outputs.base_exists != 'true'
        # The immutable version tag is created only when preflight proved it
        # absent. Mutable `:latest` is promoted in the final release job after
        # npm publication and only for a non-older release. The guard refuses
        # to proceed unless
        # exactly two digests arrived, so a half-built matrix (one arch
        # failed under fail-fast:false) cannot produce a single-arch
        # `:X.Y.Z`.
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          set -euo pipefail
          refs=()
          for digest_file in "${{ runner.temp }}"/digests/*; do
            refs+=("${REGISTRY_IMAGE}@sha256:$(basename "$digest_file")")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::Expected exactly 2 platform digests, got ${#refs[@]}"
            printf '%s\n' "${refs[@]}"
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "${REGISTRY_IMAGE}:${VERSION}" \
            "${refs[@]}"

      - name: Verify base image is anonymously pullable on both platforms
        id: verify
        # The end-user contract is "an unauthenticated `docker pull` from a
        # fresh machine resolves both linux/amd64 and linux/arm64 manifests."
        # The login from the steps above must be cleared first — otherwise a
        # private package could pass verification on a credentialed runner
        # and then fail on every user's first `typeclaw start`.
        #
        # Three checks, each closing a distinct failure mode:
        #   (a) `imagetools inspect` on :X.Y.Z confirms the manifest list and
        #       both per-platform manifests exist as a single atomic record.
        #   (b) `docker pull --platform linux/amd64` proves the amd64 layer
        #       blobs are actually pullable, not just referenced.
        #   (c) `docker pull --platform linux/arm64` does the same for arm64.
        # No retries: `imagetools create` is immediately consistent, and the
        # pulls run from a fresh connection. If any step fails the image is
        # not safe to release — and because the release job `needs:` this
        # one, a failure here blocks the irreversible release finale.
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY_IMAGE}:${VERSION}"
          docker logout ghcr.io
          raw="$(mktemp)"
          trap 'rm -f -- "$raw"' EXIT
          docker buildx imagetools inspect --raw "$IMAGE" >"$raw"
          bash scripts/validate-release-image-index.sh "$raw" "$SOURCE_SHA"
          echo "digest=sha256:$(sha256sum "$raw" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/arm64 "$IMAGE"

  # ─────────────────────────── build-runtime ───────────────────────────
  # The immutable workload image is layered over the just-published matching
  # base manifest. Like build-base, native runners push only content-addressed
  # single-platform manifests; merge-runtime is the sole version-tag writer.
  build-runtime:
    name: Build managed runtime / ${{ matrix.arch }}
    needs: [checks, merge-base]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: managed-runtime-input
          path: runtime-input

      - name: Verify immutable build inputs
        run: |
          cd runtime-input
          sha256sum --check SHA256SUMS
          cat runtime.Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: runtime-input
          file: runtime-input/runtime.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.RUNTIME_REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.RUNTIME_REGISTRY_IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.RUNTIME_REGISTRY_IMAGE }}:cache-${{ matrix.arch }},mode=max

      - name: Smoke single-platform runtime by digest
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${RUNTIME_REGISTRY_IMAGE}@${DIGEST}"
          GWS_VERSION="$(cat runtime-input/gws-version.txt)"
          docker pull --platform "${{ matrix.platform }}" "$IMAGE_REF"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "$IMAGE_REF" --format '{{json .Config.Entrypoint}}')" = '["/usr/bin/tini","--","/usr/local/bin/typeclaw-entrypoint"]'
          test "$(docker image inspect "$IMAGE_REF" --format '{{json .Config.Cmd}}')" = '["run"]'
          docker run --rm --entrypoint sh \
            -e EXPECTED_VERSION="$VERSION" \
            -e EXPECTED_GWS_VERSION="$GWS_VERSION" \
            "$IMAGE_REF" -ec '
              test "$(bun -e "import pkg from \"/node_modules/typeclaw/package.json\"; console.log(pkg.version)")" = "$EXPECTED_VERSION"
              test "$(bun -e "import pkg from \"/node_modules/typeclaw-gws-multi-account/package.json\"; console.log(pkg.version)")" = "$EXPECTED_GWS_VERSION"
              test -f /opt/typeclaw/models/.typeclaw-model.json
            '
          bash scripts/smoke-managed-runtime-image.sh "$IMAGE_REF"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/runtime-digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/runtime-digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────── merge-runtime ───────────────────────────
  merge-runtime:
    name: Merge and verify managed runtime image
    needs: [checks, build-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-digests-*
          path: ${{ runner.temp }}/runtime-digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest lists
        if: needs.checks.outputs.runtime_exists != 'true'
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          set -euo pipefail
          refs=()
          for digest_file in "${{ runner.temp }}"/runtime-digests/*; do
            refs+=("${RUNTIME_REGISTRY_IMAGE}@sha256:$(basename "$digest_file")")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::Expected exactly 2 managed runtime platform digests, got ${#refs[@]}"
            printf '%s\n' "${refs[@]}"
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "${RUNTIME_REGISTRY_IMAGE}:${VERSION}" \
            "${refs[@]}"

      - name: Verify managed runtime is anonymously pullable on both platforms
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          set -euo pipefail
          IMAGE="${RUNTIME_REGISTRY_IMAGE}:${VERSION}"
          docker logout ghcr.io
          raw="$(mktemp)"
          trap 'rm -f -- "$raw"' EXIT
          docker buildx imagetools inspect --raw "$IMAGE" >"$raw"
          bash scripts/validate-release-image-index.sh "$raw" "$SOURCE_SHA"
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/arm64 "$IMAGE"

          # The second pull leaves the local tag pointing at arm64. Restore the
          # runner-native manifest before executing the CLI smoke test.
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --entrypoint bun "$IMAGE" \
            /node_modules/typeclaw/src/cli/index.ts --version

  # ─────────────────────────── release ───────────────────────────
  # The irreversible publish path, gated on verified multi-arch base and
  # managed runtime images.
  #
  # GHCR base image FIRST (built+merged+verified by the jobs above), npm
  # SECOND. Order matters: a user who `npm install`s typeclaw@X.Y.Z and runs
  # `typeclaw start` writes a per-agent Dockerfile that does
  # `FROM ghcr.io/typeclaw/typeclaw-base:X.Y.Z` (see src/init/dockerfile.ts).
  # Registry-only finale: both multi-arch indexes are already pushed AND
  # verified anonymously pullable by merge-base / merge-runtime, so the only
  # remaining acts are the :latest promotion (forward-only), the immutable
  # version tag over the reserved bump commit, and the GitHub Release.
  release:
    name: Tag and release
    needs: [checks, reserve-version, merge-base, merge-runtime]
    runs-on: ubuntu-latest
    # contents: write covers the version tag and GitHub Release; packages:
    # write covers the :latest promotion into GHCR.
    permissions:
      contents: write
      packages: write

    steps:
      # Tag from the canonical source commit so the OCI revision annotations
      # and the annotated history share one identity. The bump commit
      # reserved main before builds and is only the tag target. Full history
      # is required to resolve BUMP_SHA below. This fork has no branch
      # ruleset, so the default GITHUB_TOKEN may push the tag directly.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        if: needs.checks.outputs.promote_latest == 'true'

      - name: Login to GHCR for latest promotion
        if: needs.checks.outputs.promote_latest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote matching base image to latest
        if: needs.checks.outputs.promote_latest == 'true'
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            "${REGISTRY_IMAGE}@${{ needs.merge-base.outputs.version_digest }}"
          version_raw="$(mktemp)"
          latest_raw="$(mktemp)"
          trap 'rm -f -- "$version_raw" "$latest_raw"' EXIT
          docker logout ghcr.io
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${VERSION}" >"$version_raw"
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:latest" >"$latest_raw"
          if ! cmp -s "$version_raw" "$latest_raw"; then
            echo "::error::base image latest does not match ${VERSION}"
            exit 1
          fi

      - name: Create release tag
        if: needs.checks.outputs.tag_exists != 'true'
        # Runs after both multi-arch indexes are pushed AND verified
        # anonymously pullable, so a transient failure in either does not
        # leave a published git tag pointing at a half-released state. `reserve-version` already pushed
        # (or recovered) the package.json-only bump before builds; tag that
        # exact commit without moving main here. Existing tags are validated
        # during preflight and never force-moved.
        #
        # Pushes here use the SSH deploy key configured by `actions/checkout`
        # above. That key — and only that key — is allowed to bypass the
        # `main` branch ruleset, so this step would fail with GH013
        # ("repository rule violations") if anything below tried to push
        # via the default GITHUB_TOKEN.
        env:
          BUMP_SHA: ${{ needs.reserve-version.outputs.bump_sha }}
        run: |
          git fetch origin main
          git cat-file -e "${BUMP_SHA}^{commit}"
          git tag "${{ needs.checks.outputs.version }}" "$BUMP_SHA"
          git push origin "refs/tags/${{ needs.checks.outputs.version }}"

      - name: Create GitHub Release
        # Idempotency guard: skip if the release for this tag already exists
        # (e.g. a previous run got this far but failed elsewhere). `gh release
        # view` exits non-zero when the release doesn't exist.
        run: |
          if gh release view "${{ needs.checks.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ needs.checks.outputs.version }} already exists, skipping"
          else
            gh release create "${{ needs.checks.outputs.version }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
